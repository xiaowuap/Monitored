openapi: 3.1.0
info:
  title: Monitored API
  version: 0.3.0
  description: |
    REST contract for the device-telemetry-first Monitored control plane.
    Browser endpoints use the signed `monitored_session` cookie. Agents use a
    single-use pairing token to obtain mTLS credentials; a dedicated bearer
    token remains available only on the compatibility ingest endpoint.
servers:
  - url: http://localhost:8080
    description: Local Compose
tags:
  - name: System
  - name: Auth
  - name: Inventory
  - name: Operations
  - name: Telemetry
  - name: Connections
  - name: Governance
paths:
  /healthz:
    get:
      tags: [System]
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Control plane is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                totpCode:
                  type: string
                  pattern: '^[0-9]{6}$'
                  description: Required after this user enables TOTP.
      responses:
        "200":
          description: Signed, HttpOnly session cookie issued.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/totp/enroll:
    post:
      tags: [Auth]
      operationId: enrollTOTP
      responses:
        "201":
          description: Ephemeral enrollment secret. Confirm it within ten minutes.
          content:
            application/json:
              schema:
                type: object
                required: [secret, uri, expiresInSeconds]
                properties:
                  secret: { type: string }
                  uri: { type: string }
                  expiresInSeconds: { type: integer }
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/auth/totp/confirm:
    post:
      tags: [Auth]
      operationId: confirmTOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        "200":
          description: TOTP enabled for the current user.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      responses:
        "204": { description: Session cleared. }
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      responses:
        "200":
          description: Current operator.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/UserEnvelope"
                  - type: object
                    properties:
                      authDisabled: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/events:
    get:
      tags: [Operations]
      operationId: streamEvents
      responses:
        "200":
          description: Server-sent event stream for telemetry and workflow updates.
          content:
            text/event-stream:
              schema: { type: string }
  /api/v1/overview:
    get:
      tags: [Inventory]
      operationId: getOverview
      responses:
        "200":
          description: Operational overview.
          content:
            application/json:
              schema:
                type: object
                required:
                  - generatedAt
                  - healthScore
                  - assetCount
                  - sensorCount
                  - unknownCount
                  - firingAlertCount
                  - pendingActionCount
                  - ingestRate
                properties:
                  generatedAt: { type: string, format: date-time }
                  healthScore: { type: integer, minimum: 0, maximum: 100 }
                  assetCount: { type: integer }
                  onlineAssetCount: { type: integer }
                  sensorCount: { type: integer }
                  unknownCount: { type: integer }
                  firingAlertCount: { type: integer }
                  pendingActionCount: { type: integer }
                  ingestRate: { type: integer }
                  storageStatus: { type: string }
                  queueStatus: { type: string }
                  assetsByKind:
                    type: object
                    additionalProperties: { type: integer }
                  temperatureTrend:
                    type: array
                    items: { $ref: "#/components/schemas/OverviewPoint" }
                  recentAlerts:
                    type: array
                    items: { $ref: "#/components/schemas/Alert" }
                  hotAssets:
                    type: array
                    items: { $ref: "#/components/schemas/Asset" }
  /api/v1/assets:
    get:
      tags: [Inventory]
      operationId: listAssets
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Asset inventory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetList"
  /api/v1/sensors:
    get:
      tags: [Inventory]
      operationId: listSensors
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            type: string
            enum: [new, present, stale, removed]
      responses:
        "200":
          description: Sensor definitions and latest values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensorList"
  /api/v1/sensors/{id}/metrics:
    get:
      tags: [Telemetry]
      operationId: getSensorMetrics
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - name: hours
          in: query
          schema: { type: integer, minimum: 1, maximum: 2160, default: 24 }
      responses:
        "200":
          description: Fifteen-minute rollup for the requested range.
          content:
            application/json:
              schema:
                type: object
                required: [items, range]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MetricPoint" }
                  range:
                    type: object
                    properties:
                      hours: { type: integer }
  /api/v1/alerts:
    get:
      tags: [Operations]
      operationId: listAlerts
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: active
          in: query
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: Alert instances.
          content:
            application/json:
              schema:
                type: object
                required: [items, count]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Alert" }
                  count: { type: integer }
  /api/v1/incidents:
    get:
      tags: [Operations]
      operationId: listIncidents
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Correlated incidents and diagnosis summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericList"
  /api/v1/discovery/runs:
    get:
      tags: [Inventory]
      operationId: listDiscoveryRuns
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Discovery run history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericList"
    post:
      tags: [Inventory]
      operationId: createDiscoveryRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [agentId]
              properties:
                agentId: { type: string }
                kind: { type: string, enum: [all, local, snmp, redfish, ipmi] }
                collectors:
                  type: array
                  items: { type: string }
      responses:
        "202":
          description: Discovery accepted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/discovery/scans:
    post:
      tags: [Inventory]
      operationId: createNetworkDiscoveryScan
      description: Queues an explicit, rate-limited read-only scan on a registered Agent. No credentials are guessed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [agentId, cidr, protocols]
              properties:
                agentId: { type: string }
                cidr: { type: string }
                protocols:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [redfish, ipmi, snmp, nut]
                ports:
                  type: object
                  additionalProperties:
                    type: array
                    items: { type: integer, minimum: 1, maximum: 65535 }
                confirmLarge: { type: boolean, default: false }
                ratePerSecond: { type: integer, minimum: 1, maximum: 256, default: 32 }
                concurrency: { type: integer, minimum: 1, maximum: 64, default: 16 }
      responses:
        "202":
          description: Agent scan queued.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          description: Scan scope or limits are invalid.
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/llm/suggestions:
    get:
      tags: [Operations]
      operationId: listLLMSuggestions
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Reviewable semantic suggestions. Raw sensor identity remains immutable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericList"
  /api/v1/llm/suggestions/generate:
    post:
      tags: [Operations]
      operationId: createLLMSuggestionJob
      description: Explicitly queues a read-only sensor-labeling request. Automatic labeling remains disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sensorId, provider, model]
              properties:
                sensorId: { type: string, format: uuid }
                provider:
                  type: string
                  enum: [openai-compatible, ollama]
                model: { type: string, minLength: 1 }
                context: { type: object, additionalProperties: true }
      responses:
        "202":
          description: Label suggestion job queued.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/llm/suggestion-jobs:
    get:
      tags: [Operations]
      operationId: listLLMSuggestionJobs
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Asynchronous label suggestion job status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericList"
  /api/v1/llm/suggestions/{id}/decision:
    post:
      tags: [Operations]
      operationId: decideLLMSuggestion
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        $ref: "#/components/requestBodies/SuggestionDecision"
      responses:
        "200":
          description: Suggestion decision recorded and appended to the audit chain.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [Accepted, Rejected] }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/actions:
    get:
      tags: [Operations]
      operationId: listActions
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Approval-gated action requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericList"
    post:
      tags: [Operations]
      operationId: createAction
      description: Creates an immutable approval-gated action. Shell control syntax and non-allowlisted executables are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionRequestInput"
      responses:
        "201":
          description: Pending action created.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          description: Action is invalid or unsafe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/actions/{id}/decision:
    post:
      tags: [Operations]
      operationId: decideAction
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        $ref: "#/components/requestBodies/ActionDecision"
      responses:
        "200":
          description: Action decision recorded and appended to the audit chain.
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state: { type: string, enum: [approve, reject] }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/connections:
    get:
      tags: [Connections]
      operationId: listConnections
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Credential-redacted device connections.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericList" }
    post:
      tags: [Connections]
      operationId: createConnection
      description: Admin-only. Secrets are encrypted with purpose-bound AES-256-GCM.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, kind, endpoint]
              properties:
                name: { type: string }
                kind: { type: string, enum: [truenas, redfish, ipmi, nut, snmp, ssh, http, tcp] }
                endpoint: { type: string }
                agentId: { type: [string, "null"] }
                enabled: { type: boolean, default: true }
                tlsMode: { type: string, enum: [verify, custom_ca, insecure], default: verify }
                config: { type: object, additionalProperties: true }
                secret: { type: object, additionalProperties: true, writeOnly: true }
      responses:
        "201":
          description: Connection created without returning credentials.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/v1/rules:
    get:
      tags: [Operations]
      operationId: listRules
      responses:
        "200":
          description: Deterministic alert rules.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericList" }
    post:
      tags: [Operations]
      operationId: createRule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuleInput" }
      responses:
        "201":
          description: Rule created.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/v1/maintenance-windows:
    get:
      tags: [Operations]
      operationId: listMaintenanceWindows
      responses:
        "200":
          description: Alert maintenance windows.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericList" }
    post:
      tags: [Operations]
      operationId: createMaintenanceWindow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, startsAt, endsAt]
              properties:
                name: { type: string }
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time }
                assetId: { type: [string, "null"], format: uuid }
                ruleId: { type: [string, "null"], format: uuid }
      responses:
        "201":
          description: Maintenance window created.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/v1/notification-channels:
    get:
      tags: [Connections]
      operationId: listNotificationChannels
      responses:
        "200":
          description: Notification channels with secrets redacted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericList" }
    post:
      tags: [Connections]
      operationId: createNotificationChannel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, kind, config]
              properties:
                name: { type: string }
                kind: { type: string, enum: [telegram, feishu, webhook, smtp, bark] }
                enabled: { type: boolean, default: true }
                config: { type: object, additionalProperties: true }
                secret: { type: object, additionalProperties: true, writeOnly: true }
      responses:
        "201":
          description: Notification channel created.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/v1/notification-channels/{id}/test:
    post:
      tags: [Connections]
      operationId: testNotificationChannel
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "202":
          description: A real test delivery was queued for the Worker.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: queued }
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/notification-routes:
    get:
      tags: [Connections]
      operationId: listNotificationRoutes
      responses:
        "200":
          description: Severity, asset, grouping, locale and recovery routes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericList" }
    post:
      tags: [Connections]
      operationId: createNotificationRoute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [channelId, minSeverity]
              properties:
                channelId: { type: string, format: uuid }
                minSeverity: { type: string, enum: [info, warning, critical] }
                assetKinds:
                  type: array
                  items: { type: string }
                groupWindowSeconds: { type: integer, minimum: 0, maximum: 3600, default: 120 }
                repeatIntervalSeconds: { type: integer, minimum: 0, maximum: 604800, default: 3600 }
                sendRecovery: { type: boolean, default: true }
                locale: { type: string, enum: [zh-CN, en-US], default: zh-CN }
                enabled: { type: boolean, default: true }
      responses:
        "201":
          description: Notification route created.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/v1/diagnoses:
    get:
      tags: [Operations]
      operationId: listDiagnoses
      responses:
        "200":
          description: Structured LLM-assisted diagnoses.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericList" }
    post:
      tags: [Operations]
      operationId: createDiagnosis
      description: Queues an explicitly requested, structured, read-only LLM diagnosis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider, model]
              properties:
                incidentId: { type: [string, "null"], format: uuid }
                assetId: { type: [string, "null"], format: uuid }
                provider: { type: string, enum: [openai-compatible, ollama] }
                model: { type: string }
                context: { type: object, additionalProperties: true }
      responses:
        "202":
          description: Diagnosis queued; automatic diagnosis remains disabled.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/v1/agents:
    get:
      tags: [Inventory]
      operationId: listAgents
      responses:
        "200":
          description: Registered Agents, certificate identity, capabilities, WAL, gap and update state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentList" }
  /api/v1/agent-update-packages:
    get:
      tags: [Governance]
      operationId: listAgentUpdatePackages
      description: Lists server-cached binary packages and immutable Docker image manifests.
      responses:
        "200":
          description: Cached Agent update manifests.
          content:
            application/json:
              schema:
                type: object
                required: [items, count]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AgentUpdatePackage" }
                  count: { type: integer }
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [Governance]
      operationId: createAgentUpdatePackage
      description: Admin-only. Caches a target-specific binary or an immutable Docker image reference.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [version, strategy, os, architecture]
              properties:
                version: { type: string, maxLength: 255 }
                strategy: { type: string, enum: [binary, docker] }
                os: { type: string, enum: [linux, freebsd] }
                architecture: { type: string, enum: [amd64, arm64] }
                package:
                  type: string
                  format: binary
                  description: Required for the binary strategy.
                image:
                  type: string
                  description: Required for the docker strategy.
                imageDigest:
                  type: string
                  pattern: '^sha256:[a-fA-F0-9]{64}$'
                  description: Required unless the image already contains an @sha256 digest.
      responses:
        "201":
          description: Update manifest cached and appended to the audit chain.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentUpdatePackage" }
        "400":
          description: Target, package, digest, or size is invalid.
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/agent-update-packages/{id}/download:
    get:
      tags: [Governance]
      operationId: downloadAgentUpdatePackage
      security: []
      description: Short-lived HMAC-signed package download used by an authenticated Agent update task.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{32}$' }
        - name: expires
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cached Agent binary.
          headers:
            X-Checksum-SHA256:
              schema: { type: string, pattern: '^[a-f0-9]{64}$' }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/agents/{id}/updates:
    post:
      tags: [Governance]
      operationId: queueAgentUpdate
      description: Admin-only. Queues a target-matched update over the existing mTLS Agent task stream.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [packageId]
              properties:
                packageId: { type: string, pattern: '^[a-f0-9]{32}$' }
      responses:
        "202":
          description: Update queued and appended to the audit chain.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/agents/enrollment-tokens:
    post:
      tags: [Governance]
      operationId: createAgentEnrollmentToken
      description: Creates an Admin-only, Agent-ID-bound, single-use enrollment token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [agentId]
              properties:
                agentId:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*[A-Za-z0-9]$|^[A-Za-z0-9]$'
      responses:
        "201":
          description: One-time token and Agent startup environment. The plaintext token is not stored by Master.
          content:
            application/json:
              schema:
                type: object
                required: [agentId, token, expiresAt, environment]
                properties:
                  agentId: { type: string }
                  token: { type: string, writeOnly: true }
                  expiresAt: { type: string, format: date-time }
                  environment: { type: object, additionalProperties: { type: string } }
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/agents/enroll:
    post:
      tags: [Auth]
      operationId: enrollAgent
      security: []
      description: Exchanges an Agent-generated CSR and one-time token for a short-lived mTLS client certificate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [agentId, token, csrPem]
              properties:
                agentId: { type: string, maxLength: 128 }
                token: { type: string, writeOnly: true }
                csrPem: { type: string, writeOnly: true, maxLength: 65536 }
      responses:
        "201":
          description: Agent certificate and public CA bundle.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [agentId, certificatePem, caPem, serial, notAfter]
                properties:
                  agentId: { type: string }
                  certificatePem: { type: string }
                  caPem: { type: string }
                  serial: { type: string }
                  notAfter: { type: string, format: date-time }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/users:
    get:
      tags: [Governance]
      operationId: listUsers
      responses:
        "200":
          description: Admin-only user list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericList" }
    post:
      tags: [Governance]
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, role]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 12, writeOnly: true }
                role: { type: string, enum: [viewer, operator, admin] }
      responses:
        "201":
          description: User created with a bcrypt password hash.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/v1/capabilities:
    get:
      tags: [System]
      operationId: listCapabilities
      responses:
        "200":
          description: Collector and adapter capability matrix.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericList" }
  /api/v1/audit:
    get:
      tags: [Operations]
      operationId: listAudit
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Hash-chained audit history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericList"
  /api/v1/ingest:
    post:
      tags: [Telemetry]
      operationId: ingestTelemetry
      security:
        - agentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestBatch"
      responses:
        "202":
          description: Batch accepted.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, at]
                properties:
                  accepted: { type: integer }
                  at: { type: string, format: date-time }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Cardinality or relational validation failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: monitored_session
    agentToken:
      type: http
      scheme: bearer
      bearerFormat: opaque-agent-token
  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000 }
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  requestBodies:
    SuggestionDecision:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [decision]
            properties:
              decision: { type: string, enum: [Accepted, Rejected] }
    ActionDecision:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [decision]
            properties:
              decision: { type: string, enum: [approve, reject] }
              password:
                type: string
                format: password
                description: Required when approving a root-risk action.
              totpCode:
                type: string
                pattern: '^[0-9]{6}$'
                description: Required when approving a root-risk action.
  responses:
    Unauthorized:
      description: Authentication failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource was not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Resource has already been reviewed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: A required dependency is unavailable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Health:
      type: object
      required: [status, database]
      properties:
        status: { type: string, enum: [healthy, degraded] }
        database: { type: string }
        redis: { type: string }
        time: { type: string, format: date-time }
    UserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          type: object
          required: [email, role]
          properties:
            email: { type: string, format: email }
            role: { type: string }
    Asset:
      type: object
      required: [id, stableId, kind, name, health, connection, lastSeenAt, summary]
      properties:
        id: { type: string, format: uuid }
        stableId: { type: string }
        parentId: { type: [string, "null"], format: uuid }
        kind: { type: string }
        name: { type: string }
        vendor: { type: string }
        model: { type: string }
        health: { type: string, enum: [healthy, warning, critical, unknown] }
        connection: { type: string, enum: [online, offline, unknown] }
        lastSeenAt: { type: string, format: date-time }
        metadata: { type: object, additionalProperties: true }
        summary: { type: object, additionalProperties: true }
    Sensor:
      type: object
      required: [id, stableId, assetId, rawName, category, unit, discoveryStatus, quality]
      properties:
        id: { type: string, format: uuid }
        stableId: { type: string }
        assetId: { type: string, format: uuid }
        assetName: { type: string }
        source: { type: string }
        sourcePath: { type: string }
        rawName: { type: string }
        displayAlias: { type: [string, "null"] }
        category: { type: string }
        unit: { type: string }
        scale: { type: number }
        monotonic: { type: boolean }
        discoveryStatus: { type: string }
        quality: { type: string }
        currentValue: { type: [number, "null"] }
        currentText: { type: [string, "null"] }
        observedAt: { type: [string, "null"], format: date-time }
        metadata: { type: object, additionalProperties: true }
    Alert:
      type: object
      required: [id, fingerprint, ruleName, assetId, severity, state, summary, startedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        fingerprint: { type: string }
        ruleName: { type: string }
        assetId: { type: string, format: uuid }
        assetName: { type: string }
        sensorId: { type: [string, "null"], format: uuid }
        severity: { type: string }
        state: { type: string }
        summary: { type: string }
        value: { type: [number, "null"] }
        unit: { type: string }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resolvedAt: { type: [string, "null"], format: date-time }
    MetricPoint:
      type: object
      required: [at, min, avg, max, count]
      properties:
        at: { type: string, format: date-time }
        min: { type: number }
        avg: { type: number }
        max: { type: number }
        count: { type: integer }
    OverviewPoint:
      type: object
      properties:
        at: { type: string, format: date-time }
        average: { type: number }
        maximum: { type: number }
        powerW: { type: number }
    AssetList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Asset" }
        count: { type: integer }
    SensorList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Sensor" }
        count: { type: integer }
    GenericList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items: { type: object, additionalProperties: true }
        count: { type: integer }
    AgentList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Agent" }
        count: { type: integer }
    Agent:
      type: object
      additionalProperties: false
      required:
        [id, stableHostId, hostname, os, architecture, version, state,
         capabilities, tools, metadata, lastSeenAt, walBytes, registeredAt]
      properties:
        id: { type: string }
        stableHostId: { type: string }
        hostname: { type: string }
        os: { type: string }
        architecture: { type: string }
        version: { type: string }
        state: { type: string, enum: [online, degraded, offline, revoked] }
        certificateId: { type: string }
        capabilities:
          type: array
          items: { type: string }
        tools:
          type: array
          items: { type: string }
        metadata: { type: object, additionalProperties: true }
        lastSeenAt: { type: string, format: date-time }
        walBytes: { type: integer, format: int64 }
        oldestWalAt: { type: string, format: date-time }
        lastGapFrom: { type: string, format: date-time }
        lastGapTo: { type: string, format: date-time }
        lastGapReason: { type: string }
        registeredAt: { type: string, format: date-time }
        desiredVersion: { type: string }
        lastUpdateStatus:
          type: string
          enum: [queued, dispatched, restart_pending, staged, succeeded, failed]
        lastUpdateAt: { type: string, format: date-time }
        lastUpdateError: { type: string }
    RuleInput:
      type: object
      additionalProperties: false
      required: [name, ruleType, severity, expression]
      properties:
        name: { type: string }
        sensorId: { type: [string, "null"], format: uuid }
        assetKind: { type: string }
        ruleType: { type: string, enum: [threshold, rate, counter_delta, state, state_change, missing] }
        severity: { type: string, enum: [info, warning, critical] }
        expression: { type: object, additionalProperties: true }
        durationSeconds: { type: integer, minimum: 0 }
        recoveryExpression: { type: object, additionalProperties: true }
        missingDataMode: { type: string, enum: [ignore, alert, resolve], default: ignore }
        maintenanceWindowId: { type: [string, "null"], format: uuid }
        enabled: { type: boolean, default: true }
    ActionRequestInput:
      type: object
      additionalProperties: false
      required: [agentId, assetId, kind, title, command, workingDirectory, identity, timeoutSeconds, risk]
      properties:
        agentId: { type: string }
        assetId: { type: string, format: uuid }
        kind: { type: string }
        title: { type: string }
        command: { type: string }
        workingDirectory: { type: string }
        identity: { type: string }
        timeoutSeconds: { type: integer, minimum: 1, maximum: 3600 }
        risk: { type: string, enum: [low, medium, high, root] }
        environment:
          type: object
          additionalProperties: { type: string }
    IngestAsset:
      type: object
      additionalProperties: false
      required: [stableId, kind, name]
      properties:
        stableId: { type: string }
        parentStableId: { type: string }
        kind: { type: string }
        name: { type: string }
        vendor: { type: string }
        model: { type: string }
        metadata: { type: object, additionalProperties: true }
    IngestSensor:
      type: object
      additionalProperties: false
      required: [stableId, assetStableId, source, sourcePath, rawName, category, unit]
      properties:
        stableId: { type: string }
        assetStableId: { type: string }
        source: { type: string }
        sourcePath: { type: string }
        rawName: { type: string }
        category: { type: string }
        unit: { type: string }
        scale: { type: number, default: 1 }
        monotonic: { type: boolean }
        intervalSeconds: { type: integer }
        quality: { type: string }
        metadata: { type: object, additionalProperties: true }
    IngestSample:
      type: object
      additionalProperties: false
      required: [sensorStableId, observedAt]
      properties:
        sensorStableId: { type: string }
        observedAt: { type: string, format: date-time }
        value: { type: number }
        textValue: { type: string }
        source: { type: string }
        quality: { type: string }
        error: { type: string }
    IngestBatch:
      type: object
      additionalProperties: false
      required: [agentId, assets, sensors, samples]
      properties:
        agentId: { type: string }
        assets:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/IngestAsset" }
        sensors:
          type: array
          maxItems: 5000
          items: { $ref: "#/components/schemas/IngestSensor" }
        samples:
          type: array
          maxItems: 20000
          items: { $ref: "#/components/schemas/IngestSample" }
    AgentUpdatePackage:
      type: object
      additionalProperties: false
      required: [id, version, strategy, os, architecture, createdAt, createdBy]
      properties:
        id: { type: string, pattern: '^[a-f0-9]{32}$' }
        version: { type: string }
        strategy: { type: string, enum: [binary, docker] }
        os: { type: string, enum: [linux, freebsd] }
        architecture: { type: string, enum: [amd64, arm64] }
        fileName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        image: { type: string }
        imageDigest: { type: string, pattern: '^sha256:[a-fA-F0-9]{64}$' }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
security:
  - session: []
