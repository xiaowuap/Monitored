name: monitored

x-common-env: &common-env
  MONITORED_DATABASE_URL: postgres://monitored:${MONITORED_POSTGRES_PASSWORD}@postgres:5432/monitored?sslmode=disable
  MONITORED_REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: monitored
      POSTGRES_USER: monitored
      POSTGRES_PASSWORD: ${MONITORED_POSTGRES_PASSWORD}
    volumes:
      - ${MONITORED_DATA_DIR}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitored -d monitored"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${MONITORED_DATA_DIR}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    image: ${MONITORED_SERVER_IMAGE:-ghcr.io/xiaowuap/monitored-server}:${MONITORED_VERSION}
    group_add: ["0"]
    environment:
      <<: *common-env
      MONITORED_HTTP_ADDR: :8080
      MONITORED_GRPC_ADDR: :9443
      MONITORED_GRPC_PUBLIC_TARGET: ${MONITORED_GRPC_PUBLIC_TARGET}
      MONITORED_GRPC_INSECURE: "false"
      MONITORED_GRPC_CERT_FILE: /run/monitored-pki/server.crt
      MONITORED_GRPC_KEY_FILE: /run/monitored-pki/server.key
      MONITORED_GRPC_CLIENT_CA_FILE: /run/monitored-pki/ca.crt
      MONITORED_AGENT_CA_CERT_FILE: /run/monitored-pki/ca.crt
      MONITORED_AGENT_CA_KEY_FILE: /run/monitored-pki/ca.key
      MONITORED_AGENT_UPDATE_CACHE_DIR: /var/lib/monitored/update-cache
      MONITORED_AGENT_UPDATE_MAX_BYTES: ${MONITORED_AGENT_UPDATE_MAX_BYTES:-268435456}
      MONITORED_PUBLIC_URL: ${MONITORED_PUBLIC_URL}
      MONITORED_AGENT_TOKEN: ${MONITORED_AGENT_TOKEN}
      MONITORED_MASTER_KEY: ${MONITORED_MASTER_KEY}
      MONITORED_ADMIN_EMAIL: ${MONITORED_ADMIN_EMAIL}
      MONITORED_ADMIN_PASSWORD: ${MONITORED_ADMIN_PASSWORD}
      MONITORED_AUTH_DISABLED: "false"
      MONITORED_AUTO_MIGRATE: "true"
    volumes:
      - ${MONITORED_CONFIG_DIR}/pki/ca.crt:/run/monitored-pki/ca.crt:ro
      - ${MONITORED_CONFIG_DIR}/pki/ca.key:/run/monitored-pki/ca.key:ro
      - ${MONITORED_CONFIG_DIR}/pki/server.crt:/run/monitored-pki/server.crt:ro
      - ${MONITORED_CONFIG_DIR}/pki/server.key:/run/monitored-pki/server.key:ro
      - ${MONITORED_DATA_DIR}/update-cache:/var/lib/monitored/update-cache
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/server", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 12
    ports:
      - "${MONITORED_HTTP_PORT:-8080}:8080"
      - "${MONITORED_GRPC_PORT:-9443}:9443"
    restart: unless-stopped

  worker:
    image: ${MONITORED_WORKER_IMAGE:-ghcr.io/xiaowuap/monitored-worker}:${MONITORED_VERSION}
    environment:
      <<: *common-env
      MONITORED_WORKER_INTERVAL: ${MONITORED_WORKER_INTERVAL:-1m}
      MONITORED_MASTER_KEY: ${MONITORED_MASTER_KEY}
      MONITORED_SNMP_PROFILE_DIR: /profiles/snmp
      MONITORED_CONNECTION_TIMEOUT: ${MONITORED_CONNECTION_TIMEOUT:-45s}
      MONITORED_CONNECTION_CONCURRENCY: ${MONITORED_CONNECTION_CONCURRENCY:-8}
      MONITORED_OPENAI_BASE_URL: ${MONITORED_OPENAI_BASE_URL:-}
      MONITORED_OPENAI_API_KEY: ${MONITORED_OPENAI_API_KEY:-}
      MONITORED_OLLAMA_BASE_URL: ${MONITORED_OLLAMA_BASE_URL:-}
      MONITORED_LLM_TOKEN_BUDGET: ${MONITORED_LLM_TOKEN_BUDGET:-8000}
    depends_on:
      postgres:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${MONITORED_WEB_IMAGE:-ghcr.io/xiaowuap/monitored-web}:${MONITORED_VERSION}
    environment:
      MONITORED_WEB_REQUIRE_AUTH: "true"
      MONITORED_API_INTERNAL_URL: http://server:8080
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${MONITORED_WEB_PORT:-3000}:3000"
    restart: unless-stopped
