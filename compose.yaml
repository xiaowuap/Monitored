name: monitored

x-common-env: &common-env
  MONITORED_DATABASE_URL: ${MONITORED_DATABASE_URL:-postgres://monitored:monitored@postgres:5432/monitored?sslmode=disable}
  MONITORED_REDIS_URL: ${MONITORED_REDIS_URL:-redis://redis:6379/0}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: monitored
      POSTGRES_USER: monitored
      POSTGRES_PASSWORD: ${MONITORED_POSTGRES_PASSWORD:-monitored}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./internal/store/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitored -d monitored"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    build:
      context: .
      target: server
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        VERSION: ${MONITORED_VERSION:-dev}
    environment:
      <<: *common-env
      MONITORED_HTTP_ADDR: ${MONITORED_HTTP_ADDR:-:8080}
      MONITORED_GRPC_ADDR: ${MONITORED_GRPC_ADDR:-:9443}
      MONITORED_GRPC_PUBLIC_TARGET: ${MONITORED_GRPC_PUBLIC_TARGET:-localhost:9443}
      # Development-only default. Production deployments must mount a server
      # key pair + client CA and set this to false.
      MONITORED_GRPC_INSECURE: ${MONITORED_GRPC_INSECURE:-true}
      MONITORED_GRPC_CERT_FILE: ${MONITORED_GRPC_CERT_FILE:-}
      MONITORED_GRPC_KEY_FILE: ${MONITORED_GRPC_KEY_FILE:-}
      MONITORED_GRPC_CLIENT_CA_FILE: ${MONITORED_GRPC_CLIENT_CA_FILE:-}
      MONITORED_AGENT_CA_CERT_FILE: ${MONITORED_AGENT_CA_CERT_FILE:-}
      MONITORED_AGENT_CA_KEY_FILE: ${MONITORED_AGENT_CA_KEY_FILE:-}
      MONITORED_AGENT_UPDATE_CACHE_DIR: /var/lib/monitored/update-cache
      MONITORED_AGENT_UPDATE_MAX_BYTES: ${MONITORED_AGENT_UPDATE_MAX_BYTES:-268435456}
      MONITORED_PUBLIC_URL: ${MONITORED_PUBLIC_URL:-http://localhost:3000}
      MONITORED_AGENT_TOKEN: ${MONITORED_AGENT_TOKEN:-local-development-agent-token}
      MONITORED_MASTER_KEY: ${MONITORED_MASTER_KEY:-local-development-master-key-change-me}
      MONITORED_ADMIN_EMAIL: ${MONITORED_ADMIN_EMAIL:-admin@example.com}
      MONITORED_ADMIN_PASSWORD: ${MONITORED_ADMIN_PASSWORD:-change-me-now}
      MONITORED_AUTH_DISABLED: ${MONITORED_AUTH_DISABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/server", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
    ports:
      - "${MONITORED_HTTP_PORT:-8080}:8080"
      - "${MONITORED_GRPC_PORT:-9443}:9443"
    volumes:
      - agent-update-cache:/var/lib/monitored/update-cache
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        VERSION: ${MONITORED_VERSION:-dev}
    environment:
      <<: *common-env
      MONITORED_WORKER_INTERVAL: ${MONITORED_WORKER_INTERVAL:-1m}
      MONITORED_MASTER_KEY: ${MONITORED_MASTER_KEY:-local-development-master-key-change-me}
      MONITORED_SNMP_PROFILE_DIR: /profiles/snmp
      MONITORED_CONNECTION_TIMEOUT: ${MONITORED_CONNECTION_TIMEOUT:-45s}
      MONITORED_CONNECTION_CONCURRENCY: ${MONITORED_CONNECTION_CONCURRENCY:-8}
      MONITORED_OPENAI_BASE_URL: ${MONITORED_OPENAI_BASE_URL:-}
      MONITORED_OPENAI_API_KEY: ${MONITORED_OPENAI_API_KEY:-}
      MONITORED_OLLAMA_BASE_URL: ${MONITORED_OLLAMA_BASE_URL:-}
      MONITORED_LLM_TOKEN_BUDGET: ${MONITORED_LLM_TOKEN_BUDGET:-8000}
    depends_on:
      postgres:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/api/v1}
        NEXT_PUBLIC_MONITORED_MODE: live
        NEXT_PUBLIC_ALLOW_RUNTIME_SWITCH: ${NEXT_PUBLIC_ALLOW_RUNTIME_SWITCH:-false}
        MONITORED_API_INTERNAL_URL: http://server:8080
    depends_on:
      - server
    ports:
      - "${MONITORED_WEB_PORT:-3000}:3000"
    restart: unless-stopped

  local-agent:
    profiles: ["agent"]
    build:
      context: .
      target: agent
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        VERSION: ${MONITORED_VERSION:-dev}
    environment:
      MONITORED_SERVER_URL: http://server:8080
      MONITORED_AGENT_PROTOCOL: ${MONITORED_AGENT_PROTOCOL:-grpc}
      MONITORED_GRPC_TARGET: server:9443
      MONITORED_AGENT_GRPC_INSECURE: ${MONITORED_AGENT_GRPC_INSECURE:-true}
      MONITORED_AGENT_TLS_CERT_FILE: ${MONITORED_AGENT_TLS_CERT_FILE:-}
      MONITORED_AGENT_TLS_KEY_FILE: ${MONITORED_AGENT_TLS_KEY_FILE:-}
      MONITORED_AGENT_TLS_CA_FILE: ${MONITORED_AGENT_TLS_CA_FILE:-}
      MONITORED_AGENT_TLS_SERVER_NAME: ${MONITORED_AGENT_TLS_SERVER_NAME:-}
      MONITORED_AGENT_TOKEN: ${MONITORED_AGENT_TOKEN:-local-development-agent-token}
      MONITORED_AGENT_NAME: ${MONITORED_AGENT_NAME:-compose-host}
      MONITORED_AGENT_INTERVAL: ${MONITORED_AGENT_INTERVAL:-10s}
      MONITORED_SYSTEMD_UNITS: ${MONITORED_SYSTEMD_UNITS:-}
      MONITORED_WAL_PATH: /var/lib/monitored-agent/wal.ndjson
      MONITORED_SYS_ROOT: /host
      MONITORED_DEVICE_ROOT: ${MONITORED_DEVICE_ROOT:-/dev}
      MONITORED_SMART_INTERVAL: ${MONITORED_SMART_INTERVAL:-5m}
      MONITORED_ALLOW_ROOT_ACTIONS: ${MONITORED_ALLOW_ROOT_ACTIONS:-false}
      MONITORED_AGENT_UPDATE_MODE: ${MONITORED_AGENT_UPDATE_MODE:-disabled}
      MONITORED_AGENT_UPDATE_INSTALL_PATH: ${MONITORED_AGENT_UPDATE_INSTALL_PATH:-}
      MONITORED_AGENT_DOCKER_RESTART_COMMAND: ${MONITORED_AGENT_DOCKER_RESTART_COMMAND:-}
      MONITORED_TRUENAS_ENDPOINT: ${MONITORED_TRUENAS_ENDPOINT:-}
      MONITORED_TRUENAS_TOKEN: ${MONITORED_TRUENAS_TOKEN:-}
    volumes:
      - /sys:/host/sys:ro
      - /etc/machine-id:/host/etc/machine-id:ro
      - agent-data:/var/lib/monitored-agent
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  agent-data:
  agent-update-cache:
